name: Contratos do repositório
on:
  push:
    branches: [main]
    paths: ['README.md', 'CHANGELOG.md', 'docs/**', 'bundle/**', 'apps/**', 'scripts/**', 'tests/**', 'requirements-ci.txt', '.github/workflows/**']
  pull_request:
    paths: ['README.md', 'CHANGELOG.md', 'docs/**', 'bundle/**', 'apps/**', 'scripts/**', 'tests/**', 'requirements-ci.txt', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.9'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Preparar contratos
        run: python -m pip install Pillow==12.1.1 PyYAML==6.0.3
      - name: Validar publicação, geometria preservada e fluxos
        run: python -m unittest discover -s tests -v
