name: Bottons Editor · Windows e publicação
on:
  push:
    branches: [main]
    paths: ['apps/bottons-editor/**', 'scripts/**', 'tests/**', '.github/workflows/bottons.yml']
    tags: ['bottons-v*']
  pull_request:
    paths: ['apps/bottons-editor/**', 'scripts/**', 'tests/**', '.github/workflows/bottons.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bottons-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/bottons-editor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Instalar dependências
        run: python -m pip install -r requirements-build.txt playwright==1.59.0
      - name: Testar aplicativo
        run: python -m unittest discover -s tests -v
      - name: Validar encerramento pela bandeja e interface
        run: python ../../scripts/check_shutdown.py bottons-editor
      - name: Validar atualização e recuperação na interface
        run: python ../../scripts/check_update_flow.py bottons-editor
      - name: Testar contratos de distribuição
        working-directory: .
        run: python -m unittest discover -s tests -v
      - name: Preparar instalador
        run: ./scripts/bootstrap_inno.ps1
      - name: Compilar
        run: python scripts/build_windows.py
      - name: Validar executável e interface
        run: python -u tests/packaged_check.py dist/BottonsEditor-Portable.exe
      - name: Validar instalação e atualização
        run: python -u tests/installer_check.py
      - name: Validar migração do Moldura para Bottons Editor
        working-directory: .
        run: python -u scripts/check_migration.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: BottonsEditor-Windows-${{ github.run_id }}
          path: |
            apps/bottons-editor/dist/BottonsEditor-Setup-*.exe
            apps/bottons-editor/dist/BottonsEditor-Portable.exe
            apps/bottons-editor/dist/update.json
            apps/bottons-editor/dist/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/bottons-v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Baixar arquivos aprovados no Windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --name BottonsEditor-Windows-${{ github.run_id }} --dir dist
      - name: Publicar aplicativo e canal próprio
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/publish.py bottons-editor "$RELEASE_TAG"
