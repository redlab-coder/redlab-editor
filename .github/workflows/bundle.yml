name: RedLab Editor · Pacote completo
on:
  push:
    branches: [main]
    paths: ['bundle/**', 'scripts/bundle*.py', 'scripts/check_bundle.py', 'scripts/capture_bundle.py', 'scripts/publish_bundle.py', 'tests/test_bundle.py', '.github/workflows/bundle.yml']
    tags: ['redlab-v*']
  pull_request:
    paths: ['bundle/**', 'scripts/bundle*.py', 'scripts/check_bundle.py', 'scripts/capture_bundle.py', 'scripts/publish_bundle.py', 'tests/test_bundle.py', '.github/workflows/bundle.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: redlab-bundle-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-editors:
    if: ${{ !startsWith(github.ref, 'refs/tags/redlab-v') }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        product: [bottons-editor, polaroid-editor, medidas-editor]
    defaults:
      run:
        working-directory: apps/${{ matrix.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Preparar compilação do editor
        run: |
          python -m pip install -r requirements-build.txt
          ./scripts/bootstrap_inno.ps1
      - name: Compilar instalador independente
        run: python scripts/build_windows.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ matrix.product }}
          path: apps/${{ matrix.product }}/dist/*
          if-no-files-found: error
  windows:
    needs: build-editors
    if: ${{ !cancelled() && (needs.build-editors.result == 'success' || needs.build-editors.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Preparar compilador e contratos
        run: |
          python -m pip install -r apps/bottons-editor/requirements-build.txt
          ./apps/bottons-editor/scripts/bootstrap_inno.ps1
          python -m unittest discover -s tests -v
      - name: Receber instaladores do mesmo código
        if: ${{ !startsWith(github.ref, 'refs/tags/redlab-v') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($taskProduct in @('bottons-editor', 'polaroid-editor', 'medidas-editor')) {
            gh run download $env:GITHUB_RUN_ID --repo $env:GITHUB_REPOSITORY --name $taskProduct --dir "bundle/build/inputs/$taskProduct"
            if ($LASTEXITCODE -ne 0) { throw "Não foi possível receber $taskProduct" }
          }
      - name: Receber releases públicas exatas e verificar integridade
        if: startsWith(github.ref, 'refs/tags/redlab-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/bundle.py fetch
      - name: Compilar pacote offline
        run: python scripts/bundle.py build
      - name: Validar seleção, instalação, versões e falhas reais
        run: python -u scripts/check_bundle.py
      - name: Conferir interface do instalador
        run: python -u scripts/capture_bundle.py
      - name: Guardar diagnóstico e capturas
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: bundle-diagnostics-${{ github.run_id }}
          path: |
            bundle/build/test-logs/**
            bundle/build/screenshots/**
          if-no-files-found: ignore
      - name: Guardar pacote aprovado
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: RedlabEditor-Windows-${{ github.run_id }}
          path: bundle/dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/redlab-v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
      - name: Receber pacote aprovado no Windows
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ github.run_id }} --name RedlabEditor-Windows-${{ github.run_id }} --dir bundle/dist
      - name: Publicar pacote completo
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/publish_bundle.py "$RELEASE_TAG"
