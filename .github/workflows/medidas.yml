name: Medidas Editor · Windows e publicação
on:
  push:
    branches: [main]
    paths:
      - 'apps/medidas-editor/**'
      - '!apps/medidas-editor/docs/**'
      - '!apps/medidas-editor/**/*.md'
      - '!apps/medidas-editor/**/*.log'
      - 'scripts/**'
      - '!scripts/capture_release_docs.py'
      - '!scripts/docs_assets.py'
      - '!scripts/bundle*.py'
      - '!scripts/check_bundle.py'
      - '!scripts/capture_bundle.py'
      - '!scripts/publish_bundle.py'
      - 'tests/**'
      - 'requirements-ci.txt'
      - '.github/workflows/medidas.yml'
      - '.github/workflows/_editor-windows.yml'
    tags: ['medidas-v*']
  pull_request:
    paths:
      - 'apps/medidas-editor/**'
      - '!apps/medidas-editor/docs/**'
      - '!apps/medidas-editor/**/*.md'
      - '!apps/medidas-editor/**/*.log'
      - 'scripts/**'
      - '!scripts/capture_release_docs.py'
      - '!scripts/docs_assets.py'
      - '!scripts/bundle*.py'
      - '!scripts/check_bundle.py'
      - '!scripts/capture_bundle.py'
      - '!scripts/publish_bundle.py'
      - 'tests/**'
      - 'requirements-ci.txt'
      - '.github/workflows/medidas.yml'
      - '.github/workflows/_editor-windows.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Validar tudo ou conferir reaproveitamento sem publicar
        type: choice
        options: [validate, reuse-check]
        default: validate
permissions:
  contents: read
concurrency:
  group: medidas-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reuse:
    if: startsWith(github.ref, 'refs/tags/medidas-v') || inputs.mode == 'reuse-check'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      reused: ${{ steps.approved.outputs.reused }}
      run_id: ${{ steps.approved.outputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.9'
      - name: Encontrar e conferir a compilação aprovada do mesmo commit
        id: approved
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_artifacts.py find medidas-editor
  windows:
    needs: reuse
    if: ${{ !cancelled() && (needs.reuse.result == 'skipped' || (needs.reuse.result == 'success' && needs.reuse.outputs.reused != 'true')) }}
    uses: ./.github/workflows/_editor-windows.yml
    with:
      product: medidas-editor
      executable: MedidasEditor
      full: ${{ github.event_name != 'pull_request' }}
  publish:
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/medidas-v') && (needs.windows.result == 'success' || needs.reuse.outputs.reused == 'true') }}
    needs: [reuse, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.9'
      - name: Receber e validar os mesmos arquivos aprovados no Windows
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_RUN: ${{ needs.reuse.outputs.run_id || github.run_id }}
        run: python scripts/release_artifacts.py restore medidas-editor --run-id "$APPROVED_RUN" --directory dist
      - name: Publicar aplicativo e canal próprio
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/publish.py medidas-editor "$RELEASE_TAG"
